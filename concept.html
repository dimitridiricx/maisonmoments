<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thema's — Maison Moments</title>
<meta name="description" content="Bekijk alle thema's binnen dit feestconcept van Maison Moments.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Caveat:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mm.css">
<script src="assets/mm-data.js"></script>
</head>
<body>

<header>
  <div class="nav">
    <a href="site-volledig.html" class="brand"><img src="assets/logo.jpg" alt="Maison Moments logo"></a>
    <nav class="links" id="navLinks">
      <a href="site-volledig.html#over-ons">Over ons</a>
      <a href="themas.html" aria-current="page">Thema's</a>
      <a href="site-volledig.html#werkwijze">Hoe het werkt</a>
      <a href="site-volledig.html#contact">Contact</a>
    </nav>
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="site-volledig.html#contact" class="cta-btn">Offerte aanvragen</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<main class="wrap" id="content"></main>

<footer>
  <div class="wrap footer-bottom">
    <span>© 2026 Maison Moments</span>
    <nav>
      <a href="themas.html">Thema's</a>
      <a href="site-volledig.html#contact">Contact</a>
    </nav>
  </div>
</footer>

<script>
  MM.initMenu();

  (async () => {
    const { concepts, themes } = await MM.loadCatalog();
    const main = document.getElementById('content');
    const concept = concepts.find(c => c.slug === MM.param('c'));

    if (!concept) {
      main.innerHTML = `
        <div class="page-head">
          <h1>Dit concept vonden we niet</h1>
          <p class="lead"><a class="btn-outline" href="themas.html">Terug naar alle thema's</a></p>
        </div>`;
      return;
    }

    document.title = `${concept.name} — Maison Moments`;
    const list = themes.filter(t => t.concept === concept.slug);

    main.innerHTML = `
      <div class="page-head">
        <nav class="crumbs" aria-label="Kruimelpad">
          <a href="site-volledig.html">Home</a><span>/</span>
          <a href="themas.html">Thema's</a><span>/</span>
          <span>${MM.esc(concept.name)}</span>
        </nav>
        <div class="eyebrow">${MM.esc(concept.name)}</div>
        <h1>${MM.esc(concept.tagline)}</h1>
        <p class="lead">${MM.esc(concept.description)}</p>
      </div>
      <div class="tiles">
        ${list.length ? list.map(t => `
          <a class="tile" href="thema.html?t=${encodeURIComponent(t.slug)}">
            <div class="tile-top" style="${MM.tileBackground(t)}">${t.cover ? '' : MM.esc(t.emoji)}</div>
            <div class="tile-body">
              <h2>${MM.esc(t.name)}</h2>
              <p>${MM.esc(t.tagline)}</p>
              ${MM.resolve(t, concept, 'priceFrom') ? `<div class="tile-price">vanaf <b>${MM.euro(MM.resolve(t, concept, 'priceFrom'))}</b> ${MM.esc(MM.resolve(t, concept, 'priceUnit') || '')}</div>` : ''}
              <span class="tile-more">Bekijk dit thema</span>
            </div>
          </a>`).join('') : '<div class="empty">Binnenkort vind je hier de thema\'s van dit concept.</div>'}
      </div>`;
  })();
</script>

</body>
</html>
